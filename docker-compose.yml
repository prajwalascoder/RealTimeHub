services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Override development defaults for local Docker usage
      - NODE_ENV=production
      - CORS_ORIGIN=http://localhost:5173
      - LOG_LEVEL=info
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      # Exposing nginx (80) to 5173 on the host so your dev URLs stay the same
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
