services:
  - type: web
    name: realtimehub-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: MONGODB_URI
        sync: false  # set in Render dashboard
      - key: REDIS_URL
        sync: false  # set in Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false  # set in Render dashboard
      - key: LOG_LEVEL
        value: info
